<!doctype html><meta charset="utf-8"><title>dev frame</title>
<!-- LOCAL TESTING ONLY. Shows a Learn page inside a phone-size frame for headless screenshots.
  /learn/_review/dev_frame.html?w=375&h=812&y=0&u=/learn/daily/   (y = scroll the page down by y px after load) -->
<style>html,body{margin:0;background:#888}iframe{border:0;display:block;background:#fff}</style>
<script>
var q = new URLSearchParams(location.search), w = +(q.get('w') || 375), h = +(q.get('h') || 812), y = +(q.get('y') || 0);
document.write('<iframe id="f" width="' + w + '" height="' + h + '" src="' + (q.get('u') || '/learn/daily/') + '"></iframe>');
var f = document.getElementById('f');
f.onload = function () { if (y) setTimeout(function () { f.contentWindow.scrollTo(0, y); var r = f.contentDocument.querySelector('.reels-feed, .feed'); }, 800); };
</script>
